name: "Build Desktop (macOS & Windows)"

on:
  push:
    branches: ["main", "master"]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri Desktop App
        run: npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simpan-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### 🚀 SIMPAN Desktop Build (${{ matrix.platform }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: \`${{ matrix.platform }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${{ matrix.target }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Selesai. Unduh file installer di bagian **Artifacts**." >> $GITHUB_STEP_SUMMARY
